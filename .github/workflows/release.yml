name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x86_64
          - os: ubuntu-latest
            platform: Linux
            arch: x86_64
          - os: macos-latest
            platform: macOS
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (GLFW/X11/OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev \
            gcc-14 g++-14

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: _deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'cmake.toml') }}
          restore-keys: ${{ runner.os }}-fetchcontent-

      - name: Configure (portable)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-14
            export CXX=g++-14
          fi
          cmake -S . -B build-portable -DCMAKE_BUILD_TYPE=Release \
            -DAPP_PORTABLE=ON \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/_deps"

      - name: Build (portable)
        run: cmake --build build-portable --config Release --parallel

      - name: Test (portable)
        run: ctest --test-dir build-portable -C Release --output-on-failure

      - name: Install (portable)
        run: cmake --install build-portable --config Release --prefix install-portable

      - name: Package (portable, Unix)
        if: runner.os != 'Windows'
        run: |
          cd install-portable
          tar -czf "../${{ github.event.repository.name }}-${{ matrix.platform }}-${{ matrix.arch }}-portable.tar.gz" .

      - name: Package (portable, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path install-portable\* -DestinationPath "${{ github.event.repository.name }}-${{ matrix.platform }}-${{ matrix.arch }}-portable.zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-portable
          path: ${{ github.event.repository.name }}-*-portable.*

      - name: Configure (installer)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-14
            export CXX=g++-14
          fi
          cmake -S . -B build-installer -DCMAKE_BUILD_TYPE=Release \
            -DAPP_PORTABLE=OFF \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/_deps"

      - name: Build (installer)
        run: cmake --build build-installer --config Release --parallel

      - name: Test (installer)
        run: ctest --test-dir build-installer -C Release --output-on-failure