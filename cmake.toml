# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[cmake]
version = "3.31"
cmkr-include = "cmkr.cmake"

[project]
name = "Desktop App Template"
description = "A C++ template for building cross-platform desktop apps with ImGui and OpenGL"
languages = ["C", "CXX"]

[variables]
CMAKE_EXPORT_COMPILE_COMMANDS = true

# dependencies
[fetch-content.glfw]
git = "https://github.com/glfw/glfw"
tag = "3.5.1"
[fetch-content.nlohmann_json]
git = "https://github.com/nlohmann/json"
tag = "v3.12.0"
[fetch-content.imgui]
git = "https://github.com/ocornut/imgui"
tag = "v1.92.9b"
[fetch-content.spdlog]
git = "https://github.com/gabime/spdlog"
tag = "v1.17.0"
[fetch-content.gtest]
git = "https://github.com/google/googletest"
tag = "v1.18.0"

[target.imgui]
type = "static"
sources = [
    "${imgui_SOURCE_DIR}/imgui.cpp",
    "${imgui_SOURCE_DIR}/imgui_draw.cpp",
    "${imgui_SOURCE_DIR}/imgui_tables.cpp",
    "${imgui_SOURCE_DIR}/imgui_widgets.cpp",
    "${imgui_SOURCE_DIR}/backends/imgui_impl_glfw.cpp",
    "${imgui_SOURCE_DIR}/backends/imgui_impl_opengl3.cpp"
]
include-directories = ["${imgui_SOURCE_DIR}", "${imgui_SOURCE_DIR}/backends"]
compile-features = ["cxx_std_23"]

[target.template_lib]
type = "static"
sources = ["lib/src/**.cpp"]
include-directories = ["lib/include"]
compile-features = ["cxx_std_23"]
link-libraries = ["nlohmann_json::nlohmann_json", "spdlog::spdlog"]
precompile-headers = ["lib/include/lib_pch.hpp"]

[target.template_app]
type = "executable"
sources = [
    "src/**.cpp",
    "vendor/imgui/imgui_stdlib.cpp",
    "vendor/glad/**.c",
]
include-directories = [
    "src",
    "vendor/imgui",
    "vendor/glad/include",
]
compile-features = ["cxx_std_23"]
link-libraries = ["template_lib", "glfw", "imgui", "spdlog::spdlog"]
precompile-headers = ["src/pch.hpp"]

[target.template_tests]
type = "executable"
sources = ["tests/**.cpp"]
include-directories = ["lib/include"]
compile-features = ["cxx_std_23"]
link-libraries = ["GTest::gtest_main"]
precompile-headers = ["lib/include/lib_pch.hpp"]
cmake-after = """
enable_testing()
add_test(NAME template_tests COMMAND template_tests)
"""
